server.port=8080

# IMPORTANT: never hardcode your real key here.
# Set it as an environment variable before running:
#   Windows (cmd):  set GROQ_API_KEY=your_key_here
#   Windows (ps):   $env:GROQ_API_KEY="your_key_here"
#   Mac/Linux:      export GROQ_API_KEY=your_key_here
# Empty fallback so the app still boots without the variable - the chat then
# replies with a clear "invalid key" message instead of the server failing.
groq.api.key=${GROQ_API_KEY:}


# llama-3.3-70b-versatile was decommissioned by Groq on 16 Aug 2026 for
# free/developer tiers, so requests to it fail. Use the official replacement.
groq.model=openai/gpt-oss-120b
