<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://www.sitcoe.ac.in/wp-content/uploads/logo-221x170.png">
<title>SITCOE FAQ Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(255, 255, 255, 0.055);
    --panel-strong: rgba(255, 255, 255, 0.08);
    --stroke: rgba(255, 255, 255, 0.10);
    --stroke-glow: rgba(34, 211, 238, 0.45);
    --text: #e8ecf8;
    --muted: #8b93b0;
    --cyan: #22d3ee;
    --purple: #a855f7;
    --pink: #ec4899;
    --grad: linear-gradient(135deg, #a855f7 0%, #6366f1 45%, #22d3ee 100%);
    --grad-hot: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #22d3ee 100%);
    --radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1, h2, h3, .brand { font-family: 'Space Grotesk', 'Inter', sans-serif; }

  /* ---------- animated background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    will-change: transform;
  }
  .blob-1 { width: 520px; height: 520px; background: #7c3aed; top: -160px; left: -120px; animation: drift1 22s ease-in-out infinite alternate; }
  .blob-2 { width: 460px; height: 460px; background: #0891b2; bottom: -140px; right: -100px; animation: drift2 26s ease-in-out infinite alternate; }
  .blob-3 { width: 380px; height: 380px; background: #db2777; top: 45%; left: 55%; opacity: 0.38; animation: drift3 30s ease-in-out infinite alternate; }

  @keyframes drift1 { to { transform: translate(140px, 120px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-130px, -110px) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-160px, 90px) scale(0.85); } }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
  }

  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.12; transform: scale(0.7); } 50% { opacity: 0.8; transform: scale(1.25); } }

  /* ---------- panel ---------- */
  .stage {
    position: relative; z-index: 1;
    width: min(880px, calc(100vw - 32px));
    height: min(720px, calc(100vh - 32px));
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .glass {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .chat {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.035);
  }
  .hdr-avatar {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    border-radius: 14px;
    background: linear-gradient(160deg, rgba(168, 85, 247, 0.4), rgba(34, 211, 238, 0.25));
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.4);
  }
  .hdr-avatar svg { width: 27px; height: 27px; filter: drop-shadow(0 0 5px rgba(34, 211, 238, 0.9)); }
  .hdr-meta { flex: 1; min-width: 0; }
  .hdr-meta .brand { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }

  .icon-btn {
    font: inherit;
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--stroke);
    color: var(--muted);
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--stroke-glow);
    box-shadow: 0 0 18px rgba(34, 211, 238, 0.2);
  }

  /* ---------- body: empty state vs conversation ---------- */
  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    transition: justify-content 0.3s ease;
  }

  .messages {
    display: none;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    padding: 24px 20px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(168, 85, 247, 0.7), rgba(34, 211, 238, 0.7));
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .messages { scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.7) transparent; }

  .empty {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .mascot {
    width: 92px; height: 92px;
    display: grid; place-items: center;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(168, 85, 247, 0.35), rgba(34, 211, 238, 0.22));
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 0 46px rgba(168, 85, 247, 0.45), inset 0 0 26px rgba(34, 211, 238, 0.25);
    animation: float 4.5s ease-in-out infinite;
  }
  .mascot svg { width: 54px; height: 54px; filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.9)); }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-11px) rotate(2deg); }
  }

  .empty h1 {
    margin-top: 24px;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .empty h1 .glow-text {
    background: var(--grad-hot);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.55));
  }
  .empty p.sub {
    margin-top: 12px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 430px;
  }

  /* empty state: hero + centered composer, like ChatGPT / Claude */
  .body:not(.started) { justify-content: center; }
  .body:not(.started) .empty { display: flex; animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .body:not(.started) .messages { display: none; }
  .body:not(.started) .composer {
    width: min(660px, 100%);
    margin: 34px auto 0;
    background: rgba(0, 0, 0, 0.34);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    padding: 8px;
    box-shadow: 0 20px 46px rgba(0, 0, 0, 0.5), 0 0 34px rgba(168, 85, 247, 0.14);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .body:not(.started) .composer:focus-within {
    border-color: var(--stroke-glow);
    box-shadow: 0 20px 46px rgba(0, 0, 0, 0.5), 0 0 34px rgba(34, 211, 238, 0.22);
  }
  .body:not(.started) .composer input {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 12px 14px;
  }
  .body:not(.started) .composer input:focus { box-shadow: none; }
  .body:not(.started) .composer .send { padding: 0 18px; border-radius: 16px; }
  .body:not(.started) .disclaimer {
    width: min(660px, 100%);
    margin: 14px auto 0;
    padding: 0;
    background: transparent;
  }

  /* conversation: messages fill the panel, composer pinned to the bottom */
  .body.started .empty { display: none; }
  .body.started .messages { display: flex; flex: 1; }
  .body.started .composer { width: 100%; }
  .body.started .disclaimer { width: 100%; }

  /* ---------- messages ---------- */
  .row { display: flex; align-items: flex-end; gap: 10px; animation: msgIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .row.user { justify-content: flex-end; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .avatar {
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    border-radius: 10px;
    background: linear-gradient(160deg, rgba(168, 85, 247, 0.4), rgba(34, 211, 238, 0.25));
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 16px rgba(168, 85, 247, 0.35);
  }
  .avatar svg { width: 19px; height: 19px; }

  .bubble {
    max-width: 74%;
    padding: 12px 16px;
    font-size: 14.5px;
    line-height: 1.6;
    border-radius: 18px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.bot .bubble {
    background: var(--panel-strong);
    border: 1px solid var(--stroke);
    border-bottom-left-radius: 5px;
    color: var(--text);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .row.user .bubble {
    background: var(--grad);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-bottom-right-radius: 5px;
    color: #fff;
    box-shadow: 0 8px 26px rgba(99, 102, 241, 0.4), 0 0 24px rgba(34, 211, 238, 0.18);
  }

  .typing-row .bubble { padding: 15px 18px; }
  .dots { display: inline-flex; gap: 6px; align-items: center; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 9px var(--cyan);
    animation: bounce 1.25s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.16s; background: var(--purple); box-shadow: 0 0 9px var(--purple); }
  .dots span:nth-child(3) { animation-delay: 0.32s; background: var(--pink); box-shadow: 0 0 9px var(--pink); }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  /* ---------- composer ---------- */
  .composer {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.035);
  }
  .composer .field { flex: 1; min-width: 0; }
  .composer input {
    width: 100%;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .composer input::placeholder { color: #6b7392; }
  .composer input:focus {
    border-color: var(--stroke-glow);
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12), 0 0 22px rgba(34, 211, 238, 0.16);
  }

  .send {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 22px;
    border: none;
    border-radius: 14px;
    color: #fff;
    background: var(--grad);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.42);
  }
  .send::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.45) 50%, transparent 80%);
    transform: translateX(-120%);
  }
  .send:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(99, 102, 241, 0.55), 0 0 30px rgba(34, 211, 238, 0.3);
  }
  .send:hover:not(:disabled)::before { animation: shine 0.7s ease; }
  @keyframes shine { to { transform: translateX(120%); } }
  .send:active:not(:disabled) { transform: translateY(0); }
  .send:disabled { filter: grayscale(0.6) brightness(0.7); cursor: not-allowed; box-shadow: none; }

  .disclaimer {
    text-align: center;
    font-size: 11.5px;
    color: #6b7392;
    padding: 0 16px 14px;
    background: rgba(255, 255, 255, 0.035);
    letter-spacing: 0.02em;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 640px) {
    .stage { width: 100vw; height: 100vh; }
    .glass { border-radius: 0; border-left: none; border-right: none; }
    .bubble { max-width: 84%; }
    .send span.label { display: none; }
    .send { padding: 0 16px; }
    .icon-btn .label { display: none; }
    .empty h1 { font-size: 24px; }
    .body:not(.started) .composer { margin-top: 26px; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid"></div>
  <div class="stars" id="stars"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="robot" viewBox="0 0 64 64">
    <path d="M32 6v6" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="4.5" r="3.5" fill="#ec4899"/>
    <rect x="10" y="14" width="44" height="36" rx="13" fill="rgba(255,255,255,0.10)" stroke="#e8ecf8" stroke-width="2.6"/>
    <rect x="18" y="24" width="28" height="15" rx="7.5" fill="#05060f"/>
    <circle cx="26.5" cy="31.5" r="4.2" fill="#22d3ee"/>
    <circle cx="37.5" cy="31.5" r="4.2" fill="#a855f7"/>
    <path d="M6 27v8M58 27v8" stroke="#e8ecf8" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M25 45h14" stroke="#e8ecf8" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
  </symbol>
</svg>

<main class="stage">

  <section class="chat glass" id="chat">
    <header class="chat-header">
      <div class="hdr-avatar"><svg><use href="#robot"/></svg></div>
      <div class="hdr-meta">
        <div class="brand">SITCOE FAQ Bot</div>
        <div class="status"><span class="dot"></span> Online · Powered by Groq</div>
      </div>
      <button class="icon-btn" id="resetBtn" type="button" title="Start a new chat">
        <span aria-hidden="true">↻</span> <span class="label">New chat</span>
      </button>
    </header>

    <div class="body" id="body">
      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="empty" id="empty">
        <div class="mascot"><svg><use href="#robot"/></svg></div>
        <h1><span class="glow-text" id="greeting">Hello</span>, what can I help with?</h1>
        <p class="sub">Ask me anything about SITCOE — courses, WiFi, fees, canteen timings, campus life and more.</p>
      </div>

      <form class="composer" id="composer">
        <div class="field">
          <input type="text" id="questionInput" placeholder="Ask anything about SITCOE..." autocomplete="off" />
        </div>
        <button class="send" id="sendBtn" type="submit">
          <span class="label">Send</span> <span aria-hidden="true">➤</span>
        </button>
      </form>
      <div class="disclaimer">Answers are generated by AI — for official info, contact the college office.</div>
    </div>
  </section>

</main>

<script>
  const body = document.getElementById('body');
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('questionInput');
  const sendBtn = document.getElementById('sendBtn');
  const composer = document.getElementById('composer');
  const resetBtn = document.getElementById('resetBtn');

  const ROBOT = '<svg><use href="#robot"/></svg>';
  let busy = false;
  let started = false;

  const hour = new Date().getHours();
  document.getElementById('greeting').textContent =
    hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  const stars = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 4).toFixed(2) + 's';
    stars.appendChild(s);
  }

  function scrollDown() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addMessage(text, sender) {
    const row = document.createElement('div');
    row.className = 'row ' + sender;

    if (sender === 'bot') {
      const av = document.createElement('span');
      av.className = 'avatar';
      av.innerHTML = ROBOT;
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesDiv.appendChild(row);
    scrollDown();
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row bot typing-row';
    row.innerHTML =
      '<span class="avatar">' + ROBOT + '</span>' +
      '<div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
    messagesDiv.appendChild(row);
    scrollDown();
    return row;
  }

  async function ask(question) {
    if (busy || !question) return;
    busy = true;
    sendBtn.disabled = true;

    addMessage(question, 'user');
    const typing = showTyping();

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      let data = null;
      try { data = await response.json(); } catch (parseErr) { data = null; }

      typing.remove();
      if (!response.ok || !data || !data.answer) {
        const detail = data && (data.answer || data.error);
        addMessage(detail || ('The server returned an error (' + response.status + '). Please try again.'), 'bot');
      } else {
        addMessage(data.answer, 'bot');
      }
    } catch (err) {
      typing.remove();
      addMessage('Something went wrong. Is the backend running?', 'bot');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || busy) return;
    input.value = '';

    if (!started) {
      started = true;
      body.classList.add('started');
      setTimeout(() => ask(question), 260);
    } else {
      ask(question);
    }
  });

  resetBtn.addEventListener('click', () => {
    if (busy) return;
    messagesDiv.innerHTML = '';
    started = false;
    body.classList.remove('started');
    input.value = '';
    input.focus();
  });

  input.focus();
</script>

</body>
</html>
